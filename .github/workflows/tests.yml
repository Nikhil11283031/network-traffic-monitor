name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Demo run (detections, threat intel and ML, no AI backend)
        run: NETMON_PROVIDER=offline python -m netmon pcap samples/demo.pcap --no-web --investigate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Docker image
        run: docker build -t network-traffic-monitor .
      - name: Run the demo inside the container
        run: docker run --rm -e NETMON_PROVIDER=offline network-traffic-monitor pcap samples/demo.pcap --no-web --investigate
